<!DOCTYPE html>
<html>
<head>
    <title>Agri-Product Price Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin-top: 20px; padding: 10px; border: 2px solid #333; background-color: #f9f9f9; border-radius: 4px; font-size: 1.1em; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌾 Agricultural Price Predictor</h2>
        <form method="POST">
            
            <div class="form-group">
                <label for="product">Product Type:</label>
                <select name="product" required>
                    <option value="Wheat">Wheat</option>
                    <option value="Rice">Rice</option>
                    <option value="Maize">Maize</option>
                </select>
            </div>

            <div class="form-group">
                <label for="month">Month of Prediction:</label>
                <select name="month" required>
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    </select>
            </div>

            <div class="form-group">
                <label for="year">Year:</label>
                <input type="number" name="year" placeholder="e.g., 2026" required>
            </div>

            <div class="form-group">
                <label for="rainfall">Average Rainfall (mm):</label>
                <input type="number" step="any" name="rainfall" placeholder="e.g., 120.5" required>
            </div>
            
            <div class="form-group">
                <label for="wpi">Wholesale Price Index (WPI):</label>
                <input type="number" step="any" name="wpi" placeholder="e.g., 150.3" required>
            </div>
            
            <button type="submit">Predict Price</button>
        </form>

        {% if prediction %}
        <div class="result">
            <strong>Prediction:</strong> {{ prediction }}
        </div>
        {% endif %}

    </div>
</body>
</html>
